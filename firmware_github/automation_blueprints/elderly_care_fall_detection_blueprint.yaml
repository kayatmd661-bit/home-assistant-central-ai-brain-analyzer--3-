blueprint:
  name: "Edge-AI Elderly Fall & Inactivity Emergency Guardian"
  description: "Monitors elderly inactivity, sudden posture drop (fall detection), or unusual nighttime movements, and triggers emergency alert with voice broadcast."
  domain: automation
  input:
    motion_sensor:
      name: "Elderly Room Motion / Presence Sensor"
      selector:
        entity:
          domain: binary_sensor
    emergency_contact_notify:
      name: "Emergency Notification Target"
      selector:
        target:
          entity:
            domain: notify

trigger:
  - platform: event
    event_type: "edge_ai_master_fall_detected"

action:
  - service: notify.notify
    target: !input emergency_contact_notify
    data:
      title: "🚨 ইমার্জেন্সি অ্যালার্ট - সম্ভাব্য পড়ে যাওয়া সনাক্ত হয়েছে!"
      message: "বয়োজ্যেষ্ঠদের ঘরে অস্বাভাবিক নড়াচড়া বা পড়ে যাওয়ার লক্ষণ সনাক্ত হয়েছে। অনুগ্রহ করে চেক করুন।"
  - service: edge_ai_master.trigger_voice_broadcast
    data:
      message: "সতর্কতা! বয়োজ্যেষ্ঠদের ঘরে জরুরি অবস্থা সনাক্ত হয়েছে।"
      target: "all"
