name: "Edge-AI Master Brain & Storage Controller"
version: "3.14.0"
slug: "edge_ai_master_hub"
description: "Self-evolving Edge-AI Brain, Gemini 3.7 Flash Cloud Teacher, Pure NumPy Offline Inference, Multi-Drive NVMe/SSD Storage & Zstandard Compression, Lovelace Card, and 3-Tier Bengali Voice Engine for Home Assistant."
url: "https://github.com/kayatmd5/firmware-github"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_title: "EDGE-AI Master Hub (21 Dashboards)"
panel_icon: "mdi:brain"
hassio_api: true
hassio_role: admin
homeassistant_api: true
audio: true
bluetooth: true
uart: true
usb: true
gpio: true
full_access: true
privileged:
  - "SYS_ADMIN"
  - "NET_ADMIN"
  - "SYS_RAWIO"
  - "SYS_RESOURCE"
  - "SYS_TIME"
  - "SYS_NICE"
  - "DAC_READ_SEARCH"
  - "IPC_LOCK"
  - "NET_RAW"
  - "SYS_MODULE"
  - "SYS_PTRACE"
map:
  - share:rw
  - config:rw
  - ssl:rw
  - media:rw
  - backup:rw
ports:
  3000/tcp: 3000
  8080/tcp: 8080
webui: "http://[HOST]:[PORT:3000]"
options:
  gemini_api_keys: []
  authority_mode: "AUTONOMOUS_WITH_LOGS"
  audio_routing: "SMART_AUTO_DETECT"
  storage:
    models_path: "/share/edge_ai/models"
    training_data_path: "/share/edge_ai/training_data"
    vectors_path: "/share/edge_ai/vectors"
    auto_failover: true
    fallback_path: "/data/edge_ai_fallback"
  touch_explain_voice_enabled: true
schema:
  gemini_api_keys:
    - str
  authority_mode: list(AUTONOMOUS_WITH_LOGS|STRICT_HUMAN_IN_THE_LOOP|SIMULATION_ONLY)
  audio_routing: list(SMART_AUTO_DETECT|LOCAL_HEADLESS_SPEAKER|DASHBOARD_BROWSER|MULTI_ROOM_BROADCAST)
  storage:
    models_path: str
    training_data_path: str
    vectors_path: str
    auto_failover: bool
    fallback_path: str
  touch_explain_voice_enabled: bool
