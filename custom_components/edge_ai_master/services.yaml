trigger_voice_broadcast:
  name: "Trigger Voice Broadcast"
  description: "Broadcasts a natural spoken voice message in Bengali or English across selected smart speakers."
  fields:
    message:
      name: "Message"
      description: "Text to speak"
      required: true
      example: "স্বাগতম! এজ-এআই মাস্টার সক্রিয় আছে।"
      selector:
        text:
    target:
      name: "Speaker Target"
      description: "Target speaker room (living_room, bedroom, all)"
      required: false
      default: "all"
      selector:
        select:
          options:
            - "all"
            - "living_room"
            - "bedroom"
            - "dashboard_browser"

run_compression:
  name: "Run High-Density Dataset Compression"
  description: "Compresses learned household dialogue pairs and AST routines using Zstandard."
  fields:
    dataset_name:
      name: "Dataset Name"
      required: true
      default: "household_routines"
      selector:
        text:
    format:
      name: "Compression Algorithm"
      required: false
      default: "zstd"
      selector:
        select:
          options:
            - "zstd"
            - "msgpack"
            - "gzip"

benchmark_ram_streaming:
  name: "Benchmark Direct-RAM Streaming"
  description: "Measures on-the-fly decompression and Pure NumPy memory loading throughput."
  fields:
    file_name:
      name: "Archive File Name"
      required: false
      default: "knowledge_distill_v3.jsonl.zst"
      selector:
        text:
