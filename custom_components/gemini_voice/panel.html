
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gemini Voice Engine</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      background-color: var(--primary-background-color, #111111);
      color: var(--primary-text-color, #ffffff);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .card {
      background: var(--card-background-color, #1e1e1e);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: var(--primary-color, #03a9f4);
    }
    p {
      line-height: 1.6;
      color: var(--secondary-text-color, #b0b0b0);
    }
    .status {
      display: inline-block;
      padding: 8px 16px;
      background: #1b5e20;
      color: #81c784;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gemini Voice Engine</h1>
    <p>native multimodal ভয়েস অ্যাসিস্ট্যান্ট সক্রিয় রয়েছে।</p>
    <p>মোবাইল অ্যাপ বা ব্রাউজারের Assist ফিচার ব্যবহার করে ভয়েস কমান্ড প্রদান করুন।</p>
    <div class="status">অনলাইন</div>
  </div>
</body>
</html>
